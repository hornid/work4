<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galactic Access</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --cyan: #00f5ff;
            --violet: #a855f7;
            --magenta: #ff00ff;
            --pink: #ec4899;
            --green: #00ff88;
            --red: #ff3366;
        }

        html, body {
            height: 100%; width: 100%; overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #050010;
            touch-action: manipulation;
        }

        /* === GALACTIC BACKGROUND === */
        #galactic-bg {
            position: fixed; inset: 0; z-index: 0;
            background: 
                radial-gradient(ellipse at 25% 30%, rgba(168, 85, 247, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 75% 60%, rgba(0, 245, 255, 0.12) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 50%, #0a0820 0%, #050010 100%);
        }

        .nebula {
            position: fixed; border-radius: 50%; filter: blur(120px); z-index: 0; pointer-events: none;
        }
        .nebula-1 { width: 500px; height: 450px; background: radial-gradient(ellipse, rgba(168,85,247,0.45), transparent 70%); top: -15%; left: -15%; animation: n1 14s ease-in-out infinite alternate; }
        .nebula-2 { width: 450px; height: 450px; background: radial-gradient(ellipse, rgba(0,245,255,0.3), transparent 70%); bottom: -15%; right: -10%; animation: n2 12s ease-in-out infinite alternate; }
        .nebula-3 { width: 300px; height: 300px; background: radial-gradient(ellipse, rgba(236,72,153,0.25), transparent 70%); top: 40%; left: 50%; animation: n3 10s ease-in-out infinite alternate; }

        @keyframes n1 { 0% { opacity: 0.3; transform: translate(0,0) scale(1); } 100% { opacity: 0.6; transform: translate(30px,20px) scale(1.1); } }
        @keyframes n2 { 0% { opacity: 0.2; transform: translate(0,0) scale(1); } 100% { opacity: 0.5; transform: translate(-25px,-20px) scale(1.15); } }
        @keyframes n3 { 0% { opacity: 0.15; transform: translate(-50%,0) scale(1); } 100% { opacity: 0.4; transform: translate(-50%,30px) scale(1.2); } }

        #star-canvas, #sparkle-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

        /* === PAGE SYSTEM === */
        .page { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 20px; }
        .page.active { display: flex; }

        /* === MAIN CONTAINER === */
        .main-container {
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            width: 100%; max-width: 360px;
        }

        /* === PHOTO SLOT (LEFT) === */
        .photo-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            align-self: flex-start; margin-left: 10px;
            animation: slideInLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0; transform: translateX(-30px);
        }

        @keyframes slideInLeft { to { opacity: 1; transform: translateX(0); } }

        .photo-slot {
            width: 80px; height: 80px; border-radius: 50%; position: relative;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .photo-slot:active { transform: scale(0.9); }

        .photo-ring-glow {
            position: absolute; inset: -4px; border-radius: 50%;
            background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
            filter: blur(10px); opacity: 0.7; animation: spin 3s linear infinite;
        }
        .photo-ring {
            position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent;
            background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--magenta), var(--cyan)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            animation: spin 3s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .photo-inner {
            width: 68px; height: 68px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(168,85,247,0.15), rgba(0,245,255,0.08));
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(168,85,247,0.15); position: relative; z-index: 1;
        }
        .photo-inner img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .photo-placeholder { display: flex; flex-direction: column; align-items: center; gap: 3px; color: rgba(255,255,255,0.35); font-size: 0.55rem; padding: 8px; }
        .photo-placeholder svg { width: 18px; height: 18px; stroke: var(--cyan); fill: none; stroke-width: 1.5; filter: drop-shadow(0 0 5px rgba(0,245,255,0.4)); }
        #photo-input { display: none; }
        .photo-label { font-size: 0.55rem; color: rgba(255,255,255,0.25); letter-spacing: 2px; text-transform: uppercase; }

        /* === GLASS CARD === */
        .glass-card {
            position: relative; width: 100%;
            background: linear-gradient(145deg, rgba(168,85,247,0.08) 0%, rgba(0,245,255,0.03) 100%);
            border: 1px solid rgba(168,85,247,0.15); border-radius: 24px;
            backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8);
            padding: 28px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05), 0 0 50px rgba(168,85,247,0.1);
            animation: cardBuild 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
            opacity: 0; transform: translateY(25px) scale(0.95);
        }
        @keyframes cardBuild { to { opacity: 1; transform: translateY(0) scale(1); } }

        .glass-card::before {
            content: ''; position: absolute; inset: -1px; border-radius: 24px;
            background: linear-gradient(135deg, rgba(168,85,247,0.35), transparent 40%, transparent 60%, rgba(0,245,255,0.25));
            z-index: -1; opacity: 0.5;
        }
        .glass-card::after {
            content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        .title-area { text-align: center; opacity: 0; animation: fadeUp 0.7s ease 1s forwards; }
        .title-area h2 { font-size: 1.25rem; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; background: linear-gradient(90deg, var(--cyan), var(--violet), var(--magenta)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 8px rgba(168,85,247,0.4)); }
        .title-area p { font-size: 0.65rem; color: rgba(255,255,255,0.3); margin-top: 4px; letter-spacing: 1.5px; }

        .divider { width: 40px; height: 1px; background: linear-gradient(90deg, transparent, var(--violet), transparent); box-shadow: 0 0 6px var(--violet); opacity: 0; animation: fadeUp 0.5s ease 1.3s forwards; }

        .password-area { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; opacity: 0; animation: fadeUp 0.7s ease 1.5s forwards; }
        .password-label { font-size: 0.6rem; color: rgba(255,255,255,0.25); letter-spacing: 3px; text-transform: uppercase; }
        .password-container { display: flex; gap: 8px; width: 100%; justify-content: center; }
        .digit-input {
            flex: 1; max-width: 54px; height: 56px;
            background: rgba(168,85,247,0.06); border: 1px solid rgba(168,85,247,0.12);
            border-radius: 12px; color: white; font-size: 1.4rem; font-weight: 300;
            text-align: center; outline: none; transition: all 0.3s ease;
            caret-color: var(--cyan);
        }
        .digit-input:focus { border-color: var(--violet); background: rgba(168,85,247,0.12); box-shadow: 0 0 20px rgba(168,85,247,0.2), inset 0 0 12px rgba(168,85,247,0.04); transform: translateY(-2px); }
        .digit-input.filled { border-color: var(--cyan); background: rgba(0,245,255,0.06); box-shadow: 0 0 10px rgba(0,245,255,0.15); }
        .digit-input.error { animation: shake 0.5s ease; border-color: var(--red); box-shadow: 0 0 20px rgba(255,51,102,0.35); background: rgba(255,51,102,0.06); }
        .digit-input.success { border-color: var(--green); box-shadow: 0 0 20px rgba(0,255,136,0.35); background: rgba(0,255,136,0.06); }

        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }

        .submit-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, rgba(168,85,247,0.15), rgba(0,245,255,0.08));
            border: 1px solid rgba(168,85,247,0.2); border-radius: 12px;
            color: white; font-size: 0.8rem; font-weight: 500; letter-spacing: 3px;
            text-transform: uppercase; cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative; overflow: hidden;
            opacity: 0; animation: fadeUp 0.6s ease 1.8s forwards;
        }
        .submit-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(168,85,247,0.4), rgba(0,245,255,0.2)); opacity: 0; transition: opacity 0.3s; }
        .submit-btn::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.03) 50%, transparent 60%); transform: translateX(-100%); animation: shimmer 5s ease-in-out infinite; }
        @keyframes shimmer { 0%{transform:translateX(-100%)} 50%,100%{transform:translateX(100%)} }
        .submit-btn:active { transform: scale(0.95); }
        .submit-btn:active::before { opacity: 1; }
        .submit-btn span { position: relative; z-index: 1; }

        .hint { font-size: 0.55rem; color: rgba(255,255,255,0.12); text-align: center; opacity: 0; animation: fadeUp 0.5s ease 2.1s forwards; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* === WRONG CODE PAGE === */
        .error-card {
            position: relative; width: 100%; max-width: 320px;
            background: linear-gradient(145deg, rgba(255,51,102,0.06) 0%, rgba(168,85,247,0.03) 100%);
            border: 1px solid rgba(255,51,102,0.2); border-radius: 24px;
            backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8);
            padding: 30px 24px; display: flex; flex-direction: column; align-items: center; gap: 18px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.6), 0 0 50px rgba(255,51,102,0.08);
            animation: cardBuild 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .error-card::before {
            content: ''; position: absolute; inset: -1px; border-radius: 24px;
            background: linear-gradient(135deg, rgba(255,51,102,0.35), transparent 40%, transparent 60%, rgba(255,51,102,0.2));
            z-index: -1; opacity: 0.5;
        }

        .error-icon {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(255,51,102,0.1); border: 2px solid rgba(255,51,102,0.3);
            display: flex; align-items: center; justify-content: center;
            animation: pulse-error 2s ease-in-out infinite;
        }
        .error-icon svg { width: 28px; height: 28px; stroke: var(--red); fill: none; stroke-width: 2; stroke-linecap: round; }
        @keyframes pulse-error { 0%,100% { box-shadow: 0 0 0 0 rgba(255,51,102,0.3); } 50% { box-shadow: 0 0 20px 8px rgba(255,51,102,0.1); } }

        .error-title { font-size: 1.1rem; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; color: var(--red); filter: drop-shadow(0 0 8px rgba(255,51,102,0.4)); }
        .error-msg { font-size: 0.7rem; color: rgba(255,255,255,0.4); text-align: center; line-height: 1.6; }

        /* GIF SLOT */
        .gif-slot {
            width: 100%; min-height: 140px; border-radius: 16px;
            background: rgba(255,51,102,0.04); border: 2px dashed rgba(255,51,102,0.15);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .gif-slot:hover { border-color: rgba(255,51,102,0.3); background: rgba(255,51,102,0.06); }
        .gif-slot.has-gif { border-style: solid; border-color: rgba(255,51,102,0.25); }
        .gif-slot.has-gif::before {
            content: ''; position: absolute; inset: -2px; border-radius: 16px; z-index: -1;
            background: conic-gradient(from 0deg, var(--red), var(--violet), var(--magenta), var(--red));
            filter: blur(8px); opacity: 0.4; animation: spin 4s linear infinite;
        }
        .gif-slot.has-gif::after {
            content: ''; position: absolute; inset: 0; border-radius: 14px;
            box-shadow: inset 0 0 20px rgba(255,51,102,0.1);
        }
        .gif-slot img, .gif-slot video { width: 100%; border-radius: 12px; display: block; }
        .gif-placeholder { display: flex; flex-direction: column; align-items: center; gap: 6px; color: rgba(255,255,255,0.3); font-size: 0.65rem; }
        .gif-placeholder svg { width: 24px; height: 24px; stroke: var(--red); fill: none; stroke-width: 1.5; opacity: 0.5; }
        #gif-input { display: none; }

        .try-again-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, rgba(255,51,102,0.15), rgba(168,85,247,0.08));
            border: 1px solid rgba(255,51,102,0.25); border-radius: 12px;
            color: white; font-size: 0.8rem; font-weight: 500; letter-spacing: 3px;
            text-transform: uppercase; cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative; overflow: hidden;
        }
        .try-again-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,51,102,0.4), rgba(168,85,247,0.2)); opacity: 0; transition: opacity 0.3s; }
        .try-again-btn:active { transform: scale(0.95); }
        .try-again-btn:active::before { opacity: 1; }
        .try-again-btn span { position: relative; z-index: 1; }

        /* === SUCCESS PAGE === */
        .success-page {
            position: fixed; inset: 0; z-index: 200; display: none;
            align-items: center; justify-content: center; background: #050010; padding: 30px;
        }
        .success-page.active { display: flex; }
        .success-content { text-align: center; animation: successAppear 1s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes successAppear { from { opacity: 0; transform: scale(0.7) translateY(30px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .success-text {
            font-size: 2.2rem; font-weight: 200; letter-spacing: 5px; text-transform: uppercase;
            background: linear-gradient(90deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
            background-size: 300% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; animation: gradientFlow 3s linear infinite;
            filter: drop-shadow(0 0 20px rgba(168,85,247,0.5));
        }
        @keyframes gradientFlow { 0%{background-position:0% 50%} 100%{background-position:300% 50%} }
        .success-sub { color: rgba(255,255,255,0.3); margin-top: 10px; font-size: 0.8rem; letter-spacing: 2px; }
        .success-sparkles { margin-top: 20px; display: flex; gap: 8px; justify-content: center; }
        .success-sparkle { font-size: 1.3rem; animation: bounce 1.5s ease infinite; }
        .success-sparkle:nth-child(2) { animation-delay: 0.2s; }
        .success-sparkle:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,100%{transform:translateY(0) scale(1);opacity:0.6} 50%{transform:translateY(-6px) scale(1.15);opacity:1} }
    </style>
</head>
<body>
    <!-- Background -->
    <div id="galactic-bg"></div>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>
    <canvas id="star-canvas"></canvas>
    <canvas id="sparkle-canvas"></canvas>

    <!-- Page 1: Main Access -->
    <div class="page active" id="page-access">
        <div class="main-container">
            <!-- Photo Left -->
            <div class="photo-wrapper">
                <div class="photo-slot" onclick="document.getElementById('photo-input').click()">
                    <div class="photo-ring-glow"></div>
                    <div class="photo-ring"></div>
                    <div class="photo-inner">
                        <div class="photo-placeholder" id="photo-placeholder">
                            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2zM12 17a4 4 0 100-8 4 4 0 000 8z"/></svg>
                            <span>Add Photo</span>
                        </div>
                        <img id="photo-preview" style="display:none;" alt="">
                    </div>
                    <input type="file" id="photo-input" accept="image/*" onchange="loadPhoto(event)">
                </div>
                <span class="photo-label">Your Photo</span>
            </div>

            <!-- Glass Card -->
            <div class="glass-card">
                <div class="title-area">
                    <h2>Access</h2>
                    <p>Enter the code to continue</p>
                </div>
                <div class="divider"></div>
                <div class="password-area">
                    <span class="password-label">4-Digit Code</span>
                    <div class="password-container">
                        <input type="password" class="digit-input" maxlength="1" inputmode="numeric">
                        <input type="password" class="digit-input" maxlength="1" inputmode="numeric">
                        <input type="password" class="digit-input" maxlength="1" inputmode="numeric">
                        <input type="password" class="digit-input" maxlength="1" inputmode="numeric">
                    </div>
                </div>
                <button class="submit-btn" onclick="checkPassword()"><span>Enter</span></button>
                <p class="hint">Hint: It's written in the stars</p>
            </div>
        </div>
    </div>

    <!-- Page 2: Wrong Code -->
    <div class="page" id="page-error">
        <div class="error-card">
            <div class="error-icon">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
            <div class="error-title">Wrong Code</div>
            <p class="error-msg">The code you entered is incorrect.<br>Please try again.</p>

            <!-- GIF Slot -->
            <div class="gif-slot" id="gif-slot" onclick="document.getElementById('gif-input').click()">
                <div class="gif-placeholder" id="gif-placeholder">
                    <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
                    <span>Add GIF</span>
                </div>
                <input type="file" id="gif-input" accept="image/gif,video/*" onchange="loadGif(event)">
            </div>

            <button class="try-again-btn" onclick="tryAgain()"><span>Try Again</span></button>
        </div>
    </div>

    <!-- Page 3: Success -->
    <div class="success-page" id="success-page">
        <div class="success-content">
            <div class="success-text">Welcome</div>
            <p class="success-sub">Access Granted</p>
            <div class="success-sparkles">
                <span class="success-sparkle">✨</span>
                <span class="success-sparkle">💜</span>
                <span class="success-sparkle">✨</span>
            </div>
        </div>
    </div>

    <script>
        // === STAR FIELD ===
        const starCanvas = document.getElementById('star-canvas');
        const starCtx = starCanvas.getContext('2d');
        let bgStars = [];
        function resize(c) { c.width = window.innerWidth; c.height = window.innerHeight; }
        resize(starCanvas);
        window.addEventListener('resize', () => resize(starCanvas));
        for (let i = 0; i < 200; i++) bgStars.push({ x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight, s: Math.random()*1.5+0.3, o: Math.random()*0.6+0.2, sp: Math.random()*0.002+0.001, of: Math.random()*Math.PI*2 });
        function drawStars(t) {
            starCtx.clearRect(0,0,starCanvas.width,starCanvas.height);
            bgStars.forEach(s => { const f=0.5+0.5*Math.sin(t*s.sp+s.of); const o=s.o*f;
                starCtx.beginPath(); starCtx.arc(s.x,s.y.s.s,0,Math.PI*2); starCtx.fillStyle=`rgba(255,255,255,${o})`; starCtx.fill();
                if(s.s>1){starCtx.beginPath();starCtx.arc(s.x,s.y,s.s*3,0,Math.PI*2);starCtx.fillStyle=`rgba(200,220,255,${o*0.08})`;starCtx.fill();}
            });
        }

        // === SPARKLES ===
        const spCanvas = document.getElementById('sparkle-canvas');
        const spCtx = spCanvas.getContext('2d');
        let sparkles = [];
        resize(spCanvas);
        window.addEventListener('resize', () => resize(spCanvas));
        class Sparkle { constructor(){this.reset(true);}
            reset(init){this.x=Math.random()*spCanvas.width;this.y=init?Math.random()*spCanvas.height:-10;this.size=Math.random()*2+0.5;this.speedY=Math.random()*1.2+0.4;this.speedX=(Math.random()-0.5)*0.3;this.opacity=Math.random()*0.7+0.3;this.twinkleSpeed=Math.random()*0.012+0.005;this.twinkleOffset=Math.random()*Math.PI*2;this.hue=[180,260,280,300,320][Math.floor(Math.random()*5)];this.brightness=Math.random()*20+70;}
            update(t){this.y+=this.speedY;this.x+=this.speedX+Math.sin(t*0.0006+this.x*0.01)*0.2;this.currentOpacity=this.opacity*(0.5+0.5*Math.sin(t*this.twinkleSpeed+this.twinkleOffset));if(this.y>spCanvas.height+10)this.reset(false);if(this.x<-10)this.x=spCanvas.width+10;if(this.x>spCanvas.width+10)this.x=-10;}
            draw(){const s=this.size;const o=this.currentOpacity;
                // Big glow
                const g=spCtx.createRadialGradient(this.x,this.y,0,this.x,this.y,s*6);
                g.addColorStop(0,`hsla(${this.hue},100%,85%,${o*0.8})`);
                g.addColorStop(0.3,`hsla(${this.hue},100%,75%,${o*0.3})`);
                g.addColorStop(0.6,`hsla(${this.hue},100%,65%,${o*0.1})`);
                g.addColorStop(1,'transparent');
                spCtx.fillStyle=g;spCtx.beginPath();spCtx.arc(this.x,this.y,s*6,0,Math.PI*2);spCtx.fill();
                // Core bright
                spCtx.fillStyle=`hsla(${this.hue},100%,98%,${o})`;spCtx.beginPath();spCtx.arc(this.x,this.y,s,0,Math.PI*2);spCtx.fill();
                // Cross flare
                if(s>0.8&&o>0.4){spCtx.strokeStyle=`hsla(${this.hue},100%,95%,${o*0.5})`;spCtx.lineWidth=0.6;spCtx.beginPath();spCtx.moveTo(this.x-s*4,this.y);spCtx.lineTo(this.x+s*4,this.y);spCtx.moveTo(this.x,this.y-s*4);spCtx.lineTo(this.x,this.y+s*4);spCtx.stroke();}
                // Extra diamond flare on big ones
                if(s>1.5&&o>0.7){spCtx.strokeStyle=`hsla(${this.hue},100%,90%,${o*0.3})`;spCtx.lineWidth=0.4;spCtx.beginPath();spCtx.moveTo(this.x-s*2.5,this.y-s*2.5);spCtx.lineTo(this.x+s*2.5,this.y+s*2.5);spCtx.moveTo(this.x+s*2.5,this.y-s*2.5);spCtx.lineTo(this.x-s*2.5,this.y+s*2.5);spCtx.stroke();}
            }}
        for(let i=0;i<120;i++)sparkles.push(new Sparkle());
        function animate(t){spCtx.clearRect(0,0,spCanvas.width,spCanvas.height);drawStars(t);sparkles.forEach(s=>{s.update(t);s.draw();});requestAnimationFrame(animate);}
        requestAnimationFrame(animate);

        // === PASSWORD ===
        const inputs = document.querySelectorAll('.digit-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => { const v=e.target.value; if(v&&!/^\d$/.test(v)){e.target.value='';return;} if(v){input.classList.add('filled');if(index<inputs.length-1)inputs[index+1].focus();} else input.classList.remove('filled'); });
            input.addEventListener('keydown', (e) => { if(e.key==='Backspace'&&!e.target.value&&index>0)inputs[index-1].focus(); });
            input.addEventListener('paste', (e) => { e.preventDefault(); const p=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,4); p.split('').forEach((c,i)=>{if(inputs[i]){inputs[i].value=c;inputs[i].classList.add('filled');}}); if(inputs[p.length])inputs[p].focus(); });
        });

        function checkPassword() {
            const code = Array.from(inputs).map(i => i.value).join('');
            if (code.length < 4) { inputs.forEach(i => { if (!i.value) { i.classList.add('error'); setTimeout(() => i.classList.remove('error'), 500); }}); return; }
            if (code === '1435') {
                inputs.forEach(i => i.classList.add('success'));
                setTimeout(() => document.getElementById('success-page').classList.add('active'), 600);
            } else {
                inputs.forEach(i => { i.classList.add('error'); setTimeout(() => i.classList.remove('error'), 500); });
                setTimeout(() => { document.getElementById('page-access').classList.remove('active'); document.getElementById('page-error').classList.add('active'); }, 700);
            }
        }

        function tryAgain() {
            document.getElementById('page-error').classList.remove('active');
            document.getElementById('page-access').classList.add('active');
            inputs.forEach(i => { i.value = ''; i.classList.remove('filled','error','success'); });
            setTimeout(() => inputs[0].focus(), 400);
        }

        setTimeout(() => inputs[0].focus(), 1500);

        // === PHOTO ===
        function loadPhoto(e) {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            reader.onload = function(ev) { document.getElementById('photo-preview').src = ev.target.result; document.getElementById('photo-preview').style.display = 'block'; document.getElementById('photo-placeholder').style.display = 'none'; };
            reader.readAsDataURL(f);
        }

        // === GIF ===
        function loadGif(e) {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            const slot = document.getElementById('gif-slot');
            const placeholder = document.getElementById('gif-placeholder');
            reader.onload = function(ev) {
                // Remove old media elements but keep placeholder and input
                const mediaEls = slot.querySelectorAll('img, video');
                mediaEls.forEach(el => el.remove());
                
                slot.classList.add('has-gif');
                placeholder.style.display = 'none';
                
                if (f.type.startsWith('image/gif') || f.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    img.style.cssText = 'width:100%;border-radius:12px;display:block;';
                    slot.insertBefore(img, slot.firstChild);
                } else if (f.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.src = ev.target.result;
                    video.autoplay = true; video.loop = true; video.muted = true;
                    video.style.cssText = 'width:100%;border-radius:12px;display:block;';
                    slot.insertBefore(video, slot.firstChild);
                }
            };
            reader.readAsDataURL(f);
        }

        // Make sure GIF slot click works on wrong code page
        document.getElementById('gif-slot').addEventListener('click', function(e) {
            if (e.target.tagName !== 'IMG' && e.target.tagName !== 'VIDEO') {
                document.getElementById('gif-input').click();
            }
        });
    </script>
</body>
