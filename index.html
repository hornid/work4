<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galactic Access</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --cyan: #00f5ff;
            --violet: #8b5cf6;
            --magenta: #ff00ff;
            --pink: #ec4899;
            --purple-dark: #1a0a2e;
            --purple-mid: #2d1b4e;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a1a;
            touch-action: manipulation;
        }

        /* === GALACTIC BACKGROUND === */
        #galactic-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 70% 40%, rgba(139, 92, 246, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 30% 70%, rgba(0, 245, 255, 0.1) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, #0a0a2e 0%, #050510 100%);
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }

        .nebula-1 {
            width: 500px; height: 500px;
            background: radial-gradient(ellipse, rgba(139, 92, 246, 0.4), transparent 70%);
            top: -20%; right: -10%;
            animation: nebula1 12s ease-in-out infinite alternate;
        }
        .nebula-2 {
            width: 400px; height: 400px;
            background: radial-gradient(ellipse, rgba(0, 245, 255, 0.25), transparent 70%);
            bottom: -10%; left: -10%;
            animation: nebula2 15s ease-in-out infinite alternate;
        }
        .nebula-3 {
            width: 350px; height: 350px;
            background: radial-gradient(ellipse, rgba(255, 0, 255, 0.2), transparent 70%);
            top: 50%; right: 20%;
            animation: nebula3 10s ease-in-out infinite alternate;
        }

        @keyframes nebula1 {
            0% { opacity: 0.3; transform: translate(0, 0) scale(1); }
            100% { opacity: 0.6; transform: translate(-30px, 20px) scale(1.1); }
        }
        @keyframes nebula2 {
            0% { opacity: 0.2; transform: translate(0, 0) scale(1); }
            100% { opacity: 0.5; transform: translate(20px, -15px) scale(1.1); }
        }
        @keyframes nebula3 {
            0% { opacity: 0.15; transform: translate(0, 0) scale(1); }
            100% { opacity: 0.4; transform: translate(-20px, 30px) scale(1.2); }
        }

        /* === CANVASES === */
        #star-canvas, #sparkle-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* === MAIN CONTAINER === */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 25px 20px;
            gap: 25px;
        }

        /* === PHOTO SLOT (LEFT SIDE) === */
        .photo-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: buildUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes buildUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .photo-slot {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .photo-ring-glow {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--magenta), var(--pink), var(--cyan));
            filter: blur(10px);
            opacity: 0.6;
            animation: ringSpin 4s linear infinite;
        }

        .photo-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--magenta), var(--pink), var(--cyan)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: ringSpin 4s linear infinite;
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        .photo-inner {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(0,245,255,0.08));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 0 20px rgba(139, 92, 246, 0.15);
        }

        .photo-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .photo-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255,255,255,0.3);
            font-size: 0.6rem;
            text-align: center;
            padding: 10px;
        }

        .photo-placeholder svg {
            width: 22px;
            height: 22px;
            stroke: var(--cyan);
            fill: none;
            stroke-width: 1.5;
            filter: drop-shadow(0 0 6px rgba(0, 245, 255, 0.4));
        }

        .photo-slot:active .photo-inner {
            transform: scale(0.92);
        }

        #photo-input { display: none; }

        .photo-label {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* === GLASS CARD (RIGHT SIDE) === */
        .glass-card {
            position: relative;
            background: linear-gradient(135deg, rgba(139,92,246,0.12) 0%, rgba(0,245,255,0.05) 100%);
            border: 1px solid rgba(139,92,246,0.2);
            border-radius: 22px;
            backdrop-filter: blur(20px) saturate(1.8);
            -webkit-backdrop-filter: blur(20px) saturate(1.8);
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            max-width: 320px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 0 60px rgba(139, 92, 246, 0.15);
            animation: buildUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .glass-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(139,92,246,0.4), transparent 40%, transparent 60%, rgba(0,245,255,0.3));
            z-index: -1;
            opacity: 0.5;
        }

        .glass-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
        }

        /* === TITLE === */
        .title-area {
            text-align: center;
            animation: buildUp 0.8s ease 1s forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .title-area h2 {
            font-size: 1.3rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--cyan), var(--violet), var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.4));
        }

        .title-area p {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            margin-top: 5px;
            letter-spacing: 1.5px;
        }

        /* === DIVIDER === */
        .divider {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--violet), transparent);
            box-shadow: 0 0 8px var(--violet);
            animation: fadeIn 0.6s ease 1.3s forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* === PASSWORD=*** */
        .password-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            animation: buildUp 0.8s ease 1.5s forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .password-label {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .password-container {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .digit-input {
            flex: 1;
            max-width: 55px;
            height: 58px;
            background: rgba(139,92,246,0.08);
            border: 1px solid rgba(139,92,246,0.15);
            border-radius: 12px;
            color: white;
            font-size: 1.5rem;
            font-weight: 300;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            caret-color: var(--cyan);
            -webkit-user-select: none;
            user-select: none;
        }

        .digit-input:focus {
            border-color: var(--violet);
            background: rgba(139, 92, 246, 0.15);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.25), inset 0 0 15px rgba(139, 92, 246, 0.05);
        }

        .digit-input.filled {
            border-color: var(--cyan);
            background: rgba(0, 245, 255, 0.08);
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.15);
        }

        .digit-input.error {
            animation: shake 0.5s ease;
            border-color: #ff4444;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }

        .digit-input.success {
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            background: rgba(0, 255, 136, 0.08);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }

        /* === SUBMIT BUTTON === */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(0,245,255,0.12));
            border: 1px solid rgba(139,92,246,0.25);
            border-radius: 12px;
            color: white;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: buildUp 0.6s ease 1.9s forwards;
            opacity: 0;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(139,92,246,0.4), rgba(0,245,255,0.25));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
            transform: translateX(-100%);
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            50%, 100% { transform: translateX(100%); }
        }

        .submit-btn:active {
            transform: scale(0.96);
        }

        .submit-btn:active::before { opacity: 1; }

        .submit-btn span { position: relative; z-index: 1; }

        /* === HINT === */
        .hint {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.15);
            text-align: center;
            animation: fadeIn 0.6s ease 2.2s forwards;
            opacity: 0;
        }

        /* === SUCCESS OVERLAY === */
        .success-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            background: #050510;
            padding: 30px;
        }

        .success-overlay.active { display: flex; }

        .success-content {
            text-align: center;
            animation: successAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes successAppear {
            from { opacity: 0; transform: scale(0.7) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .success-text {
            font-size: 2.2rem;
            font-weight: 200;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientFlow 3s linear infinite;
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.5));
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .success-sub {
            color: rgba(255,255,255,0.3);
            margin-top: 10px;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .success-sparkles {
            margin-top: 20px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .success-sparkle {
            font-size: 1.3rem;
            animation: sparkleBounce 1.5s ease infinite;
        }

        .success-sparkle:nth-child(2) { animation-delay: 0.2s; }
        .success-sparkle:nth-child(3) { animation-delay: 0.4s; }

        @keyframes sparkleBounce {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-6px) scale(1.15); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Background Layers -->
    <div id="galactic-bg"></div>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>
    <canvas id="star-canvas"></canvas>
    <canvas id="sparkle-canvas"></canvas>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Photo Slot -->
        <div class="photo-side">
            <div class="photo-slot" onclick="document.getElementById('photo-input').click()">
                <div class="photo-ring-glow"></div>
                <div class="photo-ring"></div>
                <div class="photo-inner" id="photo-inner">
                    <div class="photo-placeholder" id="photo-placeholder">
                        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2zM12 17a4 4 0 100-8 4 4 0 000 8z"/></svg>
                        <span>Add Photo</span>
                    </div>
                    <img id="photo-preview" style="display:none;" alt="Preview">
                </div>
                <input type="file" id="photo-input" accept="image/*" onchange="loadPhoto(event)">
            </div>
            <span class="photo-label">Your Photo</span>
        </div>

        <!-- Access Card -->
        <div class="glass-card">
            <div class="title-area">
                <h2>Access</h2>
                <p>Enter the code to continue</p>
            </div>

            <div class="divider"></div>

            <div class="password-area">
                <span class="password-label">4-Digit Code</span>
                <div class="password-container">
                    <input type="password" class="digit-input" maxlength="1" inputmode="numeric">
                    <input type="password" class="digit-input" maxlength="1" inputmode="numeric">
                    <input type="password" class="digit-input" maxlength="1" inputmode="numeric">
                    <input type="password" class="digit-input" maxlength="1" inputmode="numeric">
                </div>
            </div>

            <button class="submit-btn" onclick="checkPassword()"><span>Enter</span></button>

            <p class="hint">Hint: It's written in the stars</p>
        </div>
    </div>

    <!-- Success Overlay -->
    <div class="success-overlay" id="success-overlay">
        <div class="success-content">
            <div class="success-text">Welcome</div>
            <p class="success-sub">Access Granted</p>
            <div class="success-sparkles">
                <span class="success-sparkle">✨</span>
                <span class="success-sparkle">💜</span>
                <span class="success-sparkle">✨</span>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // Star Field
        // ============================================
        const starCanvas = document.getElementById('star-canvas');
        const starCtx = starCanvas.getContext('2d');
        let bgStars = [];

        function resizeCanvas(canvas) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas(starCanvas);
        window.addEventListener('resize', () => resizeCanvas(starCanvas));

        for (let i = 0; i < 120; i++) {
            bgStars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 1.5 + 0.3,
                opacity: Math.random() * 0.5 + 0.2,
                speed: Math.random() * 0.002 + 0.001,
                offset: Math.random() * Math.PI * 2
            });
        }

        function drawStars(time) {
            starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
            bgStars.forEach(s => {
                const flicker = 0.5 + 0.5 * Math.sin(time * s.speed + s.offset);
                const o = s.opacity * flicker;
                starCtx.beginPath();
                starCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                starCtx.fillStyle = `rgba(255, 255, 255, ${o})`;
                starCtx.fill();
                if (s.size > 1) {
                    starCtx.beginPath();
                    starCtx.arc(s.x, s.y, s.size * 3, 0, Math.PI * 2);
                    starCtx.fillStyle = `rgba(200, 220, 255, ${o * 0.1})`;
                    starCtx.fill();
                }
            });
        }

        // ============================================
        // Falling Sparkles
        // ============================================
        const sparkleCanvas = document.getElementById('sparkle-canvas');
        const sparkleCtx = sparkleCanvas.getContext('2d');
        let sparkles = [];
        resizeCanvas(sparkleCanvas);
        window.addEventListener('resize', () => resizeCanvas(sparkleCanvas));

        class Sparkle {
            constructor() { this.reset(true); }
            reset(init) {
                this.x = Math.random() * sparkleCanvas.width;
                this.y = init ? Math.random() * sparkleCanvas.height : -10;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = Math.random() * 1.2 + 0.4;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.twinkleSpeed = Math.random() * 0.012 + 0.005;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                this.hue = [180, 260, 280, 300, 320][Math.floor(Math.random() * 5)];
                this.brightness = Math.random() * 20 + 70;
            }
            update(time) {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(time * 0.0006 + this.x * 0.01) * 0.2;
                this.currentOpacity = this.opacity * (0.4 + 0.6 * Math.sin(time * this.twinkleSpeed + this.twinkleOffset));
                if (this.y > sparkleCanvas.height + 10) this.reset(false);
                if (this.x < -10) this.x = sparkleCanvas.width + 10;
                if (this.x > sparkleCanvas.width + 10) this.x = -10;
            }
            draw() {
                const s = this.size;
                const o = this.currentOpacity;
                const glow = sparkleCtx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 5);
                glow.addColorStop(0, `hsla(${this.hue}, 100%, ${this.brightness}%, ${o * 0.6})`);
                glow.addColorStop(0.4, `hsla(${this.hue}, 100%, ${this.brightness}%, ${o * 0.15})`);
                glow.addColorStop(1, 'transparent');
                sparkleCtx.fillStyle = glow;
                sparkleCtx.beginPath();
                sparkleCtx.arc(this.x, this.y, s * 5, 0, Math.PI * 2);
                sparkleCtx.fill();
                sparkleCtx.fillStyle = `hsla(${this.hue}, 100%, 95%, ${o})`;
                sparkleCtx.beginPath();
                sparkleCtx.arc(this.x, this.y, s, 0, Math.PI * 2);
                sparkleCtx.fill();
                if (s > 1.2 && o > 0.6) {
                    sparkleCtx.strokeStyle = `hsla(${this.hue}, 100%, 90%, ${o * 0.3})`;
                    sparkleCtx.lineWidth = 0.5;
                    sparkleCtx.beginPath();
                    sparkleCtx.moveTo(this.x - s * 3, this.y);
                    sparkleCtx.lineTo(this.x + s * 3, this.y);
                    sparkleCtx.moveTo(this.x, this.y - s * 3);
                    sparkleCtx.lineTo(this.x, this.y + s * 3);
                    sparkleCtx.stroke();
                }
            }
        }

        for (let i = 0; i < 80; i++) sparkles.push(new Sparkle());

        function animate(time) {
            sparkleCtx.clearRect(0, 0, sparkleCanvas.width, sparkleCanvas.height);
            drawStars(time);
            sparkles.forEach(s => { s.update(time); s.draw(); });
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // ============================================
        // Password
        // ============================================
        const inputs = document.querySelectorAll('.digit-input');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value;
                if (val && !/^\d$/.test(val)) { e.target.value = ''; return; }
                if (val) {
                    input.classList.add('filled');
                    if (index < inputs.length - 1) inputs[index + 1].focus();
                } else {
                    input.classList.remove('filled');
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) inputs[index - 1].focus();
            });
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 4);
                paste.split('').forEach((char, i) => {
                    if (inputs[i]) { inputs[i].value = char; inputs[i].classList.add('filled'); }
                });
                if (inputs[paste.length]) inputs[paste.length].focus();
            });
        });

        function checkPassword() {
            const code = Array.from(inputs).map(i => i.value).join('');
            if (code.length < 4) {
                inputs.forEach(i => { if (!i.value) { i.classList.add('error'); setTimeout(() => i.classList.remove('error'), 500); }});
                return;
            }
            if (code === '1435') {
                inputs.forEach(i => i.classList.add('success'));
                setTimeout(() => {
                    document.getElementById('success-overlay').classList.add('active');
                }, 700);
            } else {
                inputs.forEach(i => { i.classList.add('error'); setTimeout(() => i.classList.remove('error'), 500); });
                document.querySelector('.glass-card').style.animation = 'shake 0.5s ease';
                setTimeout(() => { document.querySelector('.glass-card').style.animation = ''; }, 500);
            }
        }

        setTimeout(() => inputs[0].focus(), 1800);

        // ============================================
        // Photo Upload
        // ============================================
        function loadPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('photo-preview').src = e.target.result;
                document.getElementById('photo-preview').style.display = 'block';
                document.getElementById('photo-placeholder').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
