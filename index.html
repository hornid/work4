<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Access</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cyan: #00f5ff;
            --violet: #8b5cf6;
            --magenta: #ff00ff;
            --blue: #3b82f6;
            --pink: #ec4899;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #020010;
        }

        /* === GALACTIC BACKGROUND === */
        #galactic-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(139, 92, 246, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(0, 245, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 90%, rgba(255, 0, 255, 0.1) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, #0a0a30 0%, #020010 100%);
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
        }

        .nebula-1 {
            width: 700px; height: 500px;
            background: radial-gradient(ellipse, rgba(139, 92, 246, 0.4), transparent 70%);
            top: -20%; left: -15%;
            animation: nebula1 12s ease-in-out infinite alternate;
        }
        .nebula-2 {
            width: 600px; height: 600px;
            background: radial-gradient(ellipse, rgba(0, 245, 255, 0.3), transparent 70%);
            bottom: -20%; right: -15%;
            animation: nebula2 15s ease-in-out infinite alternate;
        }
        .nebula-3 {
            width: 400px; height: 400px;
            background: radial-gradient(ellipse, rgba(255, 0, 255, 0.25), transparent 70%);
            top: 30%; left: 50%;
            animation: nebula3 10s ease-in-out infinite alternate;
        }

        @keyframes nebula1 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate(50px, 30px) scale(1.2); opacity: 0.7; }
        }
        @keyframes nebula2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(-40px, -20px) scale(1.1); opacity: 0.6; }
        }
        @keyframes nebula3 {
            0% { transform: translate(-50%, 0) scale(1); opacity: 0.2; }
            100% { transform: translate(-50%, 40px) scale(1.3); opacity: 0.5; }
        }

        /* === STAR FIELD === */
        #star-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* === SPARKLE CANVAS === */
        #sparkle-canvas {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* === MAIN CONTAINER === */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            gap: 40px;
        }

        /* === PHOTO SIDE === */
        .photo-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: buildLeft 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            opacity: 0;
            transform: translateX(-40px);
        }

        @keyframes buildLeft {
            to { opacity: 1; transform: translateX(0); }
        }

        .photo-slot {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .photo-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--magenta), var(--pink), var(--cyan)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: ringSpin 4s linear infinite;
        }

        .photo-ring-glow {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
            filter: blur(15px);
            opacity: 0.6;
            animation: ringSpin 4s linear infinite;
            z-index: -1;
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        .photo-inner {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(0,245,255,0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 0 30px rgba(139, 92, 246, 0.2);
        }

        .photo-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .photo-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.4);
            font-size: 0.75rem;
            text-align: center;
            padding: 15px;
        }

        .photo-placeholder svg {
            width: 32px;
            height: 32px;
            stroke: var(--cyan);
            fill: none;
            stroke-width: 1.5;
            filter: drop-shadow(0 0 8px rgba(0, 245, 255, 0.5));
        }

        .photo-slot:hover .photo-inner {
            transform: scale(1.05);
            box-shadow: inset 0 0 40px rgba(139, 92, 246, 0.4), 0 0 30px rgba(139, 92, 246, 0.3);
        }

        #photo-input { display: none; }

        .photo-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* === GLASS CARD === */
        .glass-card {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            backdrop-filter: blur(24px) saturate(1.8);
            -webkit-backdrop-filter: blur(24px) saturate(1.8);
            padding: 45px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            max-width: 360px;
            width: 100%;
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 0 100px rgba(139, 92, 246, 0.15);
            animation: buildCard 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.9);
        }

        @keyframes buildCard {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .glass-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(139,92,246,0.4), transparent 40%, transparent 60%, rgba(0,245,255,0.3));
            z-index: -1;
            opacity: 0.6;
        }

        .glass-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }

        /* === TITLE === */
        .title-area {
            text-align: center;
            animation: buildItem 0.8s ease 1.2s forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes buildItem {
            to { opacity: 1; transform: translateY(0); }
        }

        .title-area h2 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--cyan), var(--violet), var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.5));
        }

        .title-area p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            margin-top: 8px;
            letter-spacing: 2px;
        }

        /* === DIVIDER === */
        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--violet), transparent);
            box-shadow: 0 0 10px var(--violet);
            animation: buildItem 0.6s ease 1.4s forwards;
            opacity: 0;
        }

        /* === PASSWORD === */
        .password-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: buildItem 0.8s ease 1.6s forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        .password-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.35);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .password-container {
            display: flex;
            gap: 12px;
        }

        .digit-input {
            width: 54px;
            height: 64px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            color: white;
            font-size: 1.6rem;
            font-weight: 300;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            caret-color: var(--cyan);
        }

        .digit-input:focus {
            border-color: var(--violet);
            background: rgba(139, 92, 246, 0.1);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.3), inset 0 0 20px rgba(139, 92, 246, 0.05);
        }

        .digit-input.filled {
            border-color: var(--cyan);
            background: rgba(0, 245, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.2);
        }

        .digit-input.error {
            animation: shake 0.5s ease;
            border-color: #ff4444;
            box-shadow: 0 0 25px rgba(255, 68, 68, 0.4);
        }

        .digit-input.success {
            border-color: #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.4);
            background: rgba(0, 255, 136, 0.08);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* === SUBMIT BUTTON === */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(0,245,255,0.1));
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 14px;
            color: white;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: buildItem 0.6s ease 2s forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(139,92,246,0.5), rgba(0,245,255,0.3));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.05) 50%, transparent 60%);
            transform: translateX(-100%);
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
            100% { transform: translateX(100%); }
        }

        .submit-btn:hover {
            border-color: var(--cyan);
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.4), 0 0 80px rgba(0, 245, 255, 0.2);
            transform: translateY(-2px);
        }

        .submit-btn:hover::before { opacity: 1; }

        .submit-btn:active { transform: translateY(0); }

        .submit-btn span { position: relative; z-index: 1; }

        /* === HINT === */
        .hint {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.2);
            text-align: center;
            animation: buildItem 0.6s ease 2.3s forwards;
            opacity: 0;
        }

        /* === SUCCESS OVERLAY === */
        .success-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            background: #020010;
        }

        .success-overlay.active { display: flex; }

        .success-content {
            text-align: center;
            animation: successAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes successAppear {
            from { opacity: 0; transform: scale(0.7) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .success-text {
            font-size: 3rem;
            font-weight: 200;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientFlow 3s linear infinite;
            filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.6));
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .success-sub {
            color: rgba(255,255,255,0.4);
            margin-top: 15px;
            font-size: 0.9rem;
            letter-spacing: 3px;
        }

        /* === RESPONSIVE === */
        @media (max-width: 700px) {
            .main-container {
                flex-direction: column;
                gap: 30px;
            }
            .photo-slot { width: 130px; height: 130px; }
            .photo-inner { width: 114px; height: 114px; }
            .glass-card { padding: 35px 30px; max-width: 320px; }
            .digit-input { width: 46px; height: 56px; font-size: 1.4rem; }
        }

        @media (max-width: 400px) {
            .glass-card { padding: 30px 22px; }
            .digit-input { width: 42px; height: 52px; font-size: 1.3rem; gap: 8px; }
        }
    </style>
</head</head>
<body>
    <!-- Background Layers -->
    <div id="galactic-bg"></div>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>
    <canvas id="star-canvas"></canvas>
    <canvas id="sparkle-canvas"></canvas>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Photo Slot (Left Side) -->
        <div class="photo-side">
            <div class="photo-slot" onclick="document.getElementById('photo-input').click()">
                <div class="photo-ring-glow"></div>
                <div class="photo-ring"></div>
                <div class="photo-inner" id="photo-inner">
                    <div class="photo-placeholder" id="photo-placeholder">
                        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2zM12 17a4 4 0 100-8 4 4 0 000 8z"/></svg>
                        <span>Add Photo</span>
                    </div>
                    <img id="photo-preview" style="display:none;" alt="Preview">
                </div>
                <input type="file" id="photo-input" accept="image/*" onchange="loadPhoto(event)">
            </div>
            <span class="photo-label">Your Photo</span>
        </div>

        <!-- Access Card -->
        <div class="glass-card">
            <div class="title-area">
                <h2>Access</h2>
                <p>Enter the code to continue</p>
            </div>

            <div class="divider"></div>

            <div class="password-area">
                <span class="password-label">4-Digit Code</span>
                <div class="password-container">
                    <input type="password" class="digit-input" maxlength="1" inputmode="numeric">
                    <input type="password" class="digit-input" maxlength="1" inputmode="numeric">
                    <input type="password" class="digit-input" maxlength="1" inputmode="numeric">
                    <input type="password" class="digit-input" maxlength="1" inputmode="numeric">
                </div>
            </div>

            <button class="submit-btn" onclick="checkPassword()"><span>Enter</span></button>

            <p class="hint">Hint: It's written in the stars</p>
        </div>
    </div>

    <!-- Success Overlay -->
    <div class="success-overlay" id="success-overlay">
        <div class="success-content">
            <div class="success-text">Welcome</div>
            <p class="success-sub">Access Granted</p>
        </div>
    </div>

    <script>
        // ============================================
        // Star Field (Background Stars)
        // ============================================
        const starCanvas = document.getElementById('star-canvas');
        const starCtx = starCanvas.getContext('2d');
        let bgStars = [];

        function resizeStarCanvas() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
        }
        resizeStarCanvas();
        window.addEventListener('resize', resizeStarCanvas);

        for (let i = 0; i < 200; i++) {
            bgStars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 1.5 + 0.3,
                opacity: Math.random() * 0.6 + 0.2,
                twinkleSpeed: Math.random() * 0.003 + 0.001,
                twinkleOffset: Math.random() * Math.PI * 2
            });
        }

        function drawStars(time) {
            starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
            bgStars.forEach(star => {
                const flicker = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
                const opacity = star.opacity * flicker;

                starCtx.beginPath();
                starCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                starCtx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                starCtx.fill();

                // Glow on larger stars
                if (star.size > 1) {
                    starCtx.beginPath();
                    starCtx.arc(star.x, star.y, star.size * 3, 0, Math.PI * 2);
                    starCtx.fillStyle = `rgba(200, 220, 255, ${opacity * 0.15})`;
                    starCtx.fill();
                }
            });
        }

        // ============================================
        // Falling Sparkles (Real particles)
        // ============================================
        const sparkleCanvas = document.getElementById('sparkle-canvas');
        const sparkleCtx = sparkleCanvas.getContext('2d');
        let fallingSparkles = [];

        function resizeSparkleCanvas() {
            sparkleCanvas.width = window.innerWidth;
            sparkleCanvas.height = window.innerHeight;
        }
        resizeSparkleCanvas();
        window.addEventListener('resize', resizeSparkleCanvas);

        class Sparkle {
            constructor() {
                this.reset(true);
            }

            reset(init) {
                this.x = Math.random() * sparkleCanvas.width;
                this.y = init ? Math.random() * sparkleCanvas.height : -10;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.8 + 0.2;
                this.twinkleSpeed = Math.random() * 0.015 + 0.005;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                this.hue = [180, 260, 280, 300, 320][Math.floor(Math.random() * 5)]; // cyan to magenta range
                this.brightness = Math.random() * 20 + 70;
            }

            update(time) {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(time * 0.0008 + this.x * 0.01) * 0.3;
                this.currentOpacity = this.opacity * (0.4 + 0.6 * Math.sin(time * this.twinkleSpeed + this.twinkleOffset));

                if (this.y > sparkleCanvas.height + 10) {
                    this.reset(false);
                }
                if (this.x < -10) this.x = sparkleCanvas.width + 10;
                if (this.x > sparkleCanvas.width + 10) this.x = -10;
            }

            draw() {
                const s = this.size;
                const o = this.currentOpacity;

                // Outer glow
                const glow = sparkleCtx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 5);
                glow.addColorStop(0, `hsla(${this.hue}, 100%, ${this.brightness}%, ${o * 0.6})`);
                glow.addColorStop(0.4, `hsla(${this.hue}, 100%, ${this.brightness}%, ${o * 0.2})`);
                glow.addColorStop(1, 'transparent');
                sparkleCtx.fillStyle = glow;
                sparkleCtx.beginPath();
                sparkleCtx.arc(this.x, this.y, s * 5, 0, Math.PI * 2);
                sparkleCtx.fill();

                // Core sparkle
                sparkleCtx.fillStyle = `hsla(${this.hue}, 100%, 95%, ${o})`;
                sparkleCtx.beginPath();
                sparkleCtx.arc(this.x, this.y, s, 0, Math.PI * 2);
                sparkleCtx.fill();

                // Cross flare on brighter ones
                if (this.size > 1.2 && o > 0.6) {
                    sparkleCtx.strokeStyle = `hsla(${this.hue}, 100%, 90%, ${o * 0.4})`;
                    sparkleCtx.lineWidth = 0.5;
                    sparkleCtx.beginPath();
                    sparkleCtx.moveTo(this.x - s * 3, this.y);
                    sparkleCtx.lineTo(this.x + s * 3, this.y);
                    sparkleCtx.moveTo(this.x, this.y - s * 3);
                    sparkleCtx.lineTo(this.x, this.y + s * 3);
                    sparkleCtx.stroke();
                }
            }
        }

        for (let i = 0; i < 100; i++) {
            fallingSparkles.push(new Sparkle());
        }

        function animate(time) {
            sparkleCtx.clearRect(0, 0, sparkleCanvas.width, sparkleCanvas.height);
            drawStars(time);
            fallingSparkles.forEach(s => {
                s.update(time);
                s.draw();
            });
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // ============================================
        // Password Logic
        // ============================================
        const inputs = document.querySelectorAll('.digit-input');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value;
                if (val && !/^\d$/.test(val)) { e.target.value = ''; return; }
                if (val) {
                    input.classList.add('filled');
                    if (index < inputs.length - 1) inputs[index + 1].focus();
                } else {
                    input.classList.remove('filled');
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 4);
                paste.split('').forEach((char, i) => {
                    if (inputs[i]) { inputs[i].value = char; inputs[i].classList.add('filled'); }
                });
                if (inputs[paste.length]) inputs[paste.length].focus();
            });
        });

        function checkPassword() {
            const code = Array.from(inputs).map(i => i.value).join('');

            if (code.length < 4) {
                inputs.forEach(i => { if (!i.value) { i.classList.add('error'); setTimeout(() => i.classList.remove('error'), 500); }});
                return;
            }

            if (code === '1435') {
                inputs.forEach(i => i.classList.add('success'));
                setTimeout(() => {
                    document.getElementById('success-overlay').classList.add('active');
                }, 700);
            } else {
                inputs.forEach(i => {
                    i.classList.add('error');
                    setTimeout(() => i.classList.remove('error'), 500);
                });
                document.querySelector('.glass-card').style.animation = 'shake 0.5s ease';
                setTimeout(() => { document.querySelector('.glass-card').style.animation = ''; }, 500);
            }
        }

        setTimeout(() => inputs[0].focus(), 1800);

        // ============================================
        // Photo Upload
        // ============================================
        function loadPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('photo-preview');
                const ph = document.getElementById('photo-placeholder');
                img.src = e.target.result;
                img.style.display = 'block';
                ph.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
